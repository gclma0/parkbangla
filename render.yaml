services:
  - type: web
    name: parkbangla-api
    env: node
    rootDir: apps/api
    buildCommand: npm install && npm run prisma:generate && npm run migrate:deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parkbangla-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: parkbangla-prod-secret-2026
      - key: DEMO_OTP
        value: "123456"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: SENTRY_DSN
        sync: false

databases:
  - name: parkbangla-db
    databaseName: parkbangla
    user: parkbangla
