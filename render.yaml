services:
  - type: web
    name: parkbangla-api
    env: node
    rootDir: apps/api
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parkbangla-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: parkbangla-prod-secret-2026
      - key: DEMO_OTP
        value: "123456"

databases:
  - name: parkbangla-db
    databaseName: parkbangla
    user: parkbangla
